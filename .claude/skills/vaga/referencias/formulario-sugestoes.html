<h2 class="sr-only">Formulário para revisar as responsabilidades, os requisitos e as soft skills sugeridos para a vaga.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Detalhes da vaga — revise as sugestões</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Responsabilidades: edite, apague ou acrescente (uma por linha)</label>
      <p style="font-size:12px; color:var(--text-muted); margin:0 0 6px">{{ORIGEM_RESPONSABILIDADES}}</p>
      <textarea class="elicit-textarea" data-name="responsabilidades" rows="8">{{RESPONSABILIDADES}}</textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Requisitos: edite, apague ou acrescente (um por linha)</label>
      <p style="font-size:12px; color:var(--text-muted); margin:0 0 6px">{{ORIGEM_REQUISITOS}}</p>
      <textarea class="elicit-textarea" data-name="requisitos" rows="6">{{REQUISITOS}}</textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Diferenciais (opcional)</label>
      <p style="font-size:12px; color:var(--text-muted); margin:0 0 6px">{{ORIGEM_DIFERENCIAIS}}</p>
      <textarea class="elicit-textarea" data-name="diferenciais" rows="4">{{DIFERENCIAIS}}</textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Soft skills: edite, apague ou acrescente (uma por linha)</label>
      <p style="font-size:12px; color:var(--text-muted); margin:0 0 6px">{{ORIGEM_SOFT_SKILLS}}</p>
      <textarea class="elicit-textarea" data-name="soft_skills" rows="5">{{SOFT_SKILLS}}</textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Usar como está</button>
    <button type="button" class="elicit-submit">Gerar vaga</button>
  </div>
</form>
