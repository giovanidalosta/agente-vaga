<h2 class="sr-only">Formulário para preencher os dados de uma nova vaga da Ikatec.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Detalhes da vaga</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Qual é o cargo?</label>
      <textarea class="elicit-textarea" data-name="cargo" rows="1" placeholder="Analista de Suporte Técnico"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é a senioridade?</label>
      <div class="elicit-pills" data-name="senioridade" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Estágio">Estágio</button>
        <button type="button" class="elicit-pill" data-value="Júnior">Júnior</button>
        <button type="button" class="elicit-pill" data-value="Pleno">Pleno</button>
        <button type="button" class="elicit-pill" data-value="Sênior">Sênior</button>
        <button type="button" class="elicit-pill" data-value="Especialista">Especialista</button>
        <button type="button" class="elicit-pill" data-value="Liderança">Liderança</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é o modelo de trabalho?</label>
      <div class="elicit-pills" data-name="modelo_trabalho" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Presencial" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:170px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Presencial</span><br><span style="font-size:11px; color:var(--text-muted)">Todos os dias no escritório</span></span></button>
        <button type="button" class="elicit-pill" data-value="Híbrido" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:170px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-arrows-exchange" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Híbrido</span><br><span style="font-size:11px; color:var(--text-muted)">Escritório e home office</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remoto" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:170px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-home" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Remoto</span><br><span style="font-size:11px; color:var(--text-muted)">100% home office</span></span></button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Em qual cidade? (deixe vazio se for remoto)</label>
      <textarea class="elicit-textarea" data-name="local" rows="1" placeholder="Bauru - SP"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é o tipo de contratação?</label>
      <div class="elicit-pills" data-name="tipo_contratacao" data-multi="false">
        <button type="button" class="elicit-pill" data-value="CLT">CLT</button>
        <button type="button" class="elicit-pill" data-value="PJ">PJ</button>
        <button type="button" class="elicit-pill" data-value="Estágio">Estágio</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Quais são as responsabilidades? (uma por linha)</label>
      <textarea class="elicit-textarea" data-name="responsabilidades" rows="4" placeholder="Atender chamados dos clientes&#10;Acompanhar prazos de resolução"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Quais são os requisitos? (um por linha)</label>
      <textarea class="elicit-textarea" data-name="requisitos" rows="4" placeholder="Experiência com suporte técnico&#10;Conhecimento em Windows e Linux"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Algum diferencial? (opcional, um por linha)</label>
      <textarea class="elicit-textarea" data-name="diferenciais" rows="2" placeholder="Experiência com CRM"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Quais soft skills? (opcional; se ficar vazio, eu sugiro)</label>
      <textarea class="elicit-textarea" data-name="soft_skills" rows="2" placeholder="Comunicação clara&#10;Trabalho em equipe"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Quais benefícios? (opcional; se ficar vazio, sugiro o pacote padrão do tipo de contratação)</label>
      <textarea class="elicit-textarea" data-name="beneficios" rows="2" placeholder="Plano de saúde&#10;PLR"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é a jornada?</label>
      <div class="elicit-pills" data-name="jornada" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Integral">Integral</button>
        <button type="button" class="elicit-pill" data-value="Meio período">Meio período</button>
        <button type="button" class="elicit-pill" data-value="Outra" data-other>Outra</button>
      </div>
      <input type="text" class="elicit-other" data-for="jornada" placeholder="Escala 6x1" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Algo mais? (opcional: horário, faixa salarial, time ou área)</label>
      <textarea class="elicit-textarea" data-name="observacoes" rows="2" placeholder="Das 10h às 20h, time de Marketing"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Pular</button>
    <button type="button" class="elicit-submit">Gerar vaga</button>
  </div>
</form>
